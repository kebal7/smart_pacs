<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Patient CRUD</title>

<style>
body{
    font-family: Arial;
    margin:40px;
    background:#f5f5f5;
}

h1{
    margin-bottom:20px;
}

form{
    background:white;
    padding:15px;
    border-radius:5px;
    margin-bottom:30px;
}

input{
    padding:8px;
    margin:5px;
}

button{
    padding:8px 12px;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th, td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

th{
    background:#eee;
}

.delete{
    background:#ff4d4d;
    color:white;
    border:none;
}

</style>
</head>


<body>

<h1>Patient Management</h1>

<form id="patientForm">

<input type="text" id="name" placeholder="Name" required>
<input type="date" id="dob" required>
<input type="text" id="address" placeholder="Address">
<input type="text" id="contact" placeholder="Contact No">
<input type="text" id="emergency" placeholder="Emergency Contact">

<button type="submit">Create Patient</button>

</form>


<table>

<thead>
<tr>
<th>ID</th>
<th>Identifier</th>
<th>Name</th>
<th>DOB</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="patientsTable"></tbody>

</table>


<script>

const API = "http://localhost:5266/api/patients";

const form = document.getElementById("patientForm");
const table = document.getElementById("patientsTable");


loadPatients();


form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const patient = {
        name: document.getElementById("name").value,
        dateOfBirth: new Date(document.getElementById("dob").value).toISOString(),
        address: document.getElementById("address").value,
        contactNo: document.getElementById("contact").value,
        emergencyContact: document.getElementById("emergency").value
    };

    await fetch(API,{
        method:"POST",
        headers:{ "Content-Type":"application/json"},
        body:JSON.stringify(patient)
    });

    form.reset();
    loadPatients();
});


async function loadPatients(){

    const res = await fetch(API);
    const patients = await res.json();

    table.innerHTML="";

    patients.forEach(p=>{

        const row=document.createElement("tr");

        row.innerHTML=`
        <td>${p.id}</td>
        <td>${p.patientIdentifier}</td>
        <td>${p.name}</td>
        <td>${p.dateOfBirth.split("T")[0]}</td>
        <td>
            <button class="delete" onclick="deletePatient(${p.id})">Delete</button>
        </td>
        `;

        table.appendChild(row);

    });

}


async function deletePatient(id){

    await fetch(`${API}/${id}`,{
        method:"DELETE"
    });

    loadPatients();

}

</script>


</body>
</html>
