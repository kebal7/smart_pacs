<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Patient Manager</title>

<style>
body{
    font-family:Arial;
    margin:40px;
    background:#f4f6f8;
}
h1{ margin-bottom:20px; }
input, select{ padding:8px; margin:4px; }
button{ padding:6px 10px; cursor:pointer; }
form{ background:white; padding:15px; border-radius:5px; margin-bottom:20px; }
table{ width:100%; border-collapse:collapse; background:white; }
th,td{ padding:10px; border-bottom:1px solid #ddd; }
th{ background:#eee; }
.actions button{ margin-right:5px; }
.delete{ background:#ff4d4d; color:white; border:none; }
.edit{ background:#2b7cff; color:white; border:none; }
.save{ background:#28a745; color:white; border:none; }
.search{ margin-bottom:10px; padding:6px; width:300px; }
</style>
</head>

<body>

<h1>Patient Management</h1>

<form id="patientForm">
<input type="text" id="name" placeholder="Name" required>
<input type="date" id="dob" required>
<input type="text" id="address" placeholder="Address">
<input type="text" id="contact" placeholder="Contact No">
<input type="text" id="emergency" placeholder="Emergency Contact">
<button>Create Patient</button>
</form>

<input class="search" id="searchBox" placeholder="Search patients...">

<table>
<thead>
<tr>
<th>ID</th>
<th>Identifier</th>
<th>Name</th>
<th>DOB</th>
<th>Address</th>
<th>Contact</th>
<th>Emergency</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="patientsTable"></tbody>
</table>

<script>
const API = "http://localhost:5266/api/patients";
let patients = [];

const table = document.getElementById("patientsTable");
const form = document.getElementById("patientForm");
const searchBox = document.getElementById("searchBox");

async function loadPatients() {
    const res = await fetch(API);
    patients = await res.json();
    render(patients);
}

function render(list) {
    table.innerHTML = "";
    list.forEach(p => {
        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${p.id}</td>
            <td>${p.patientIdentifier}</td>
            <td class="name">${p.name}</td>
            <td class="dob">${p.dateOfBirth?.split("T")[0] || ""}</td>
            <td class="address">${p.address || ""}</td>
            <td class="contact">${p.contactNo || ""}</td>
            <td class="emergency">${p.emergencyContact || ""}</td>
            <td class="actions">
                <button class="edit" onclick="editRow(this,${p.id})">Edit</button>
                <button class="delete" onclick="deletePatient(${p.id})">Delete</button>
            </td>
        `;
        table.appendChild(row);
    });
}

form.addEventListener("submit", async e => {
    e.preventDefault();
    const patient = {
        name: document.getElementById("name").value,
        dateOfBirth: new Date(document.getElementById("dob").value).toISOString(),
        address: document.getElementById("address").value,
        contactNo: document.getElementById("contact").value,
        emergencyContact: document.getElementById("emergency").value
    };
    await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(patient)
    });
    form.reset();
    loadPatients();
});

searchBox.addEventListener("input", () => {
    const text = searchBox.value.toLowerCase();
    const filtered = patients.filter(p =>
        p.name.toLowerCase().includes(text) ||
        p.patientIdentifier.toLowerCase().includes(text)
    );
    render(filtered);
});

function editRow(btn, id) {
    const row = btn.closest("tr");
    ["name","dob","address","contact","emergency"].forEach(field => {
        const cell = row.querySelector(`.${field}`);
        if(!cell) return;
        const type = field === "dob" ? "date" : "text";
        cell.innerHTML = `<input type="${type}" value="${cell.innerText}">`;
    });
    btn.innerText = "Save";
    btn.className = "save";
    btn.onclick = () => saveRow(row, id);
}

async function saveRow(row, id) {
    const patient = {
        name: row.querySelector(".name input")?.value || "",
        dateOfBirth: new Date(row.querySelector(".dob input")?.value || new Date()).toISOString(),
        address: row.querySelector(".address input")?.value || "",
        contactNo: row.querySelector(".contact input")?.value || "",
        emergencyContact: row.querySelector(".emergency input")?.value || ""
    };
    await fetch(`${API}/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(patient)
    });
    loadPatients();
}

async function deletePatient(id) {
    if(!confirm("Are you sure you want to delete this patient?")) return;
    await fetch(`${API}/${id}`, { method: "DELETE" });
    loadPatients();
}

// Initial load
loadPatients();
</script>

</body>
</html>
