<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartPACS | AI Diagnostic Pro</title>

    <script src="https://unpkg.com/cornerstone-core@2.3.0/dist/cornerstone.min.js"></script>
    <script src="https://unpkg.com/cornerstone-math@0.1.9/dist/cornerstoneMath.min.js"></script>
    <script src="https://unpkg.com/cornerstone-tools@6.0.7/dist/cornerstoneTools.js"></script>
    <script src="https://unpkg.com/dicom-parser@1.8.13/dist/dicomParser.min.js"></script>
    <script src="https://unpkg.com/cornerstone-wado-image-loader@4.13.0/dist/cornerstoneWADOImageLoader.bundle.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg: #09090b; --panel: #18181b; --accent: #3b82f6; --border: #27272a; --text: #f4f4f5;
        }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow: hidden; }
        
        .layout { display: flex; flex-direction: column; height: 100vh; }
        
        /* Toolbar Styling */
        .toolbar { 
            background: var(--panel); border-bottom: 1px solid var(--border); 
            padding: 10px 20px; display: flex; gap: 10px; align-items: center;
        }
        .btn {
            background: #27272a; border: 1px solid var(--border); color: #a1a1aa;
            padding: 8px 12px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 13px;
        }
        .btn:hover { background: #3f3f46; color: white; }
        .btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .btn-ai { background: #059669; color: white; border: none; margin-left: auto; }

        /* Viewer Area */
        .main { flex: 1; display: flex; overflow: hidden; position: relative; }
        #dicomImage { 
            flex: 1; background: #000; position: relative; 
            touch-action: none; /* Prevents mobile/tablet scrolling interference */
            cursor: crosshair;
        }

        /* Sidebar */
        .sidebar { width: 300px; background: var(--panel); border-left: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; }
        
        /* Debug Console Overlay */
        #debugLog {
            position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7);
            color: #0f0; font-family: monospace; font-size: 10px; padding: 5px; pointer-events: none; border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="layout">
    <div class="toolbar">
        <div style="font-weight: 800; margin-right: 20px; color: var(--accent);">SmartPACS</div>
        <button class="btn active" id="btn-Wwwc" onclick="switchTool('Wwwc')"><i data-lucide="sun"></i> Contrast</button>
        <button class="btn" id="btn-Zoom" onclick="switchTool('Zoom')"><i data-lucide="search"></i> Zoom</button>
        <button class="btn" id="btn-Pan" onclick="switchTool('Pan')"><i data-lucide="move"></i> Pan</button>
        <button class="btn" id="btn-Length" onclick="switchTool('Length')"><i data-lucide="ruler"></i> Length</button>
        <button class="btn" id="btn-Angle" onclick="switchTool('Angle')"><i data-lucide="drafting-compass"></i> Angle</button>
        <button class="btn" onclick="resetImage()"><i data-lucide="refresh-cw"></i> Reset</button>
        <button class="btn btn-ai" onclick="runAI()"><i data-lucide="cpu"></i> Analyze AI</button>
    </div>

    <div class="main">
        <div id="dicomImage"></div>
        <div id="debugLog">System: Ready</div>
        
        <div class="sidebar">
            <h4 style="margin:0 0 15px 0; font-size: 12px; color: #71717a; text-transform: uppercase;">AI Insights</h4>
            <div id="aiResults" style="font-size: 14px; color: #a1a1aa;">Run AI to generate findings.</div>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();
    const log = (msg) => document.getElementById('debugLog').innerText = `Status: ${msg}`;

    // 1. Initialize Libraries
    const element = document.getElementById('dicomImage');
    cornerstoneWADOImageLoader.external.cornerstone = cornerstone;
    cornerstoneWADOImageLoader.external.dicomParser = dicomParser;
    cornerstoneTools.external.cornerstone = cornerstone;
    cornerstoneTools.external.cornerstoneMath = cornerstoneMath;

    // 2. Setup Cornerstone
    cornerstone.enable(element);
    cornerstoneTools.init({
        showHooks: true,
        mouseWheelScrollEnabled: true
    });

    // 3. Define and Add Tools
    const tools = [
        { name: 'Wwwc', class: cornerstoneTools.WwwcTool },
        { name: 'Zoom', class: cornerstoneTools.ZoomTool },
        { name: 'Pan', class: cornerstoneTools.PanTool },
        { name: 'Length', class: cornerstoneTools.LengthTool },
        { name: 'Angle', class: cornerstoneTools.AngleTool }
    ];

    tools.forEach(t => {
        cornerstoneTools.addTool(t.class);
    });

    // 4. Load Image
    const params = new URLSearchParams(window.location.search);
    const instanceId = params.get("instanceId") || "TEST_ID";
    const imageId = `wadouri:http://localhost:5266/Radiologist/DownloadDicom?instanceId=${instanceId}`;

    log("Loading Image...");
    cornerstone.loadAndCacheImage(imageId).then(image => {
        cornerstone.displayImage(element, image);
        log("Image Rendered. Tools Active.");
        
        // Default Interaction
        switchTool('Wwwc');
        
        // Right click for Zoom (Universal)
        cornerstoneTools.setToolActive('Zoom', { mouseButtonMask: 2 });
    }).catch(err => {
        log("Error: Server Offline or CORS issue.");
        console.error(err);
    });

    // 5. Tool Switcher Logic (The Fix)
    function switchTool(activeName) {
        log(`Active Tool: ${activeName}`);
        
        // UI
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        const btn = document.getElementById(`btn-${activeName}`);
        if(btn) btn.classList.add('active');

        // Logic: Deactivate all, then activate one
        tools.forEach(t => {
            cornerstoneTools.setToolPassive(t.name);
        });

        // Set the chosen tool to Left Click
        cornerstoneTools.setToolActive(activeName, { mouseButtonMask: 1 });
    }

    function resetImage() {
        cornerstone.reset(element);
        log("View Reset");
    }

    // AI Prediction
    async function runAI() {
        const resDiv = document.getElementById('aiResults');
        resDiv.innerHTML = "Processing...";
        try {
            const dicomRes = await fetch(`http://localhost:5266/Radiologist/DownloadDicom?instanceId=${instanceId}`);
            const blob = await dicomRes.blob();
            const formData = new FormData();
            formData.append("file", new File([blob], "img.dcm"));

            const res = await fetch("http://localhost:8001/predict", { method: "POST", body: formData });
            const data = await res.json();
            
            resDiv.innerHTML = Object.entries(data.all_predictions)
                .map(([k, v]) => `<div style="margin-bottom:10px; padding:10px; background:#27272a; border-radius:4px;">
                    <div style="font-weight:bold">${k}</div>
                    <div style="color:${v.positive ? '#ef4444' : '#10b981'}">${(v.probability*100).toFixed(1)}% Sure</div>
                </div>`).join('');
        } catch (e) {
            resDiv.innerHTML = "AI Server Unreachable.";
        }
    }

    // Prevent browser context menu on right click (so Zoom works)
    element.oncontextmenu = (e) => e.preventDefault();
</script>

</body>
</html>
