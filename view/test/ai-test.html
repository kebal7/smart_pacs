<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI DICOM Test</title>
  <style>
    body {
      font-family: Arial;
      padding: 30px;
      background: #0f172a;
      color: white;
    }

    .box {
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      max-width: 600px;
    }

    input, button {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
    }

    button {
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    pre {
      margin-top: 20px;
      background: #000;
      padding: 15px;
      overflow: auto;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>🧠 AI DICOM Test Panel</h2>

  <input type="file" id="dicomFile" accept=".dcm,.png,.jpg,.jpeg" />
  <button onclick="runAI()">Run AI Prediction</button>

  <pre id="output">Waiting...</pre>
</div>

<script>
async function runAI() {
    const fileInput = document.getElementById("dicomFile");
    const output = document.getElementById("output");

    if (!fileInput.files.length) {
        alert("Please select a file");
        return;
    }

    const file = fileInput.files[0];

    const formData = new FormData();
    formData.append("file", file, file.name);

    output.textContent = "Sending to AI...";

    try {
        const res = await fetch("http://localhost:8001/predict", {
            method: "POST",
            headers: {
                "X-Internal-Key": "super-secret-key-123"
            },
            body: formData
        });

        if (!res.ok) {
            const err = await res.text();
            output.textContent = "ERROR:\n" + err;
            return;
        }

        const data = await res.json();

        output.textContent = JSON.stringify(data, null, 2);

    } catch (err) {
        output.textContent = "NETWORK ERROR:\n" + err;
    }
}
</script>

</body>
</html>
