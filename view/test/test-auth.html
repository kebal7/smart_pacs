<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Auth Test</title>
</head>
<body>
    <h2>Register</h2>
    <form id="registerForm">
        <input type="email" id="regEmail" placeholder="Email" required><br>
        <input type="password" id="regPassword" placeholder="Password" required><br>
        <select id="regRole" required>
            <option value="">Select Role</option>
            <option value="Radiographer">Radiographer</option>
            <option value="Radiologist">Radiologist</option>
            <option value="Clinician">Clinician</option>
        </select><br>
        <button type="submit">Register</button>
    </form>

    <h2>Login</h2>
    <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" required><br>
        <input type="password" id="loginPassword" placeholder="Password" required><br>
        <button type="submit">Login</button>
    </form>

    <script>
        const apiUrl = "http://localhost:5266/api/Auth"; // Change to your API URL

        // Register
        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const data = {
                email: document.getElementById("regEmail").value,
                password: document.getElementById("regPassword").value,
                role: document.getElementById("regRole").value
            };
            const res = await fetch(`${apiUrl}/register`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            console.log("Register result:", result);
            alert(JSON.stringify(result));
        });

        // Login
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const data = {
                email: document.getElementById("loginEmail").value,
                password: document.getElementById("loginPassword").value
            };
            const res = await fetch(`${apiUrl}/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            console.log("Login result:", result);
            alert("JWT Token:\n" + result.token);
            
	    localStorage.setItem("jwtToken", result.token)
        });
    </script>
</body>
</html>
