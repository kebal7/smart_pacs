<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPACS - Radiographer Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f5f7;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #3a6ea5;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            background-color: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2, h3 {
            margin: 0 0 10px 0;
            text-align: center;
        }

        .section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fafafa;
        }

        label {
            display: block;
            margin: 8px 0 4px;
        }

        input[type="text"], input[type="file"], select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #3a6ea5;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px 0;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2c5480;
        }

        .flex {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h2>SmartPACS</h2>
        <h3>Radiographer Portal</h3>
    </header>

    <div class="container">

        <!-- Image Upload Section -->
        <div class="section">
            <h4>Upload / Acquire X-Ray</h4>
            <input type="file" id="fileInput" accept="image/*">

            <div class="flex">
                <button id="uploadImageBtn">Upload Image</button>
                <button id="acquireBtn">Simulate X-Ray Acquisition</button>
            </div>
        </div>

    <div class="section">
        <h3>Image Preview</h3>
        <img id="preview" src="" alt="No Image Loaded" style="max-width: 300px; border:1px solid #ddd; padding:5px;">
    </div>


        <!-- Patient Info Section -->
        <div class="section">
            <h4>Patient Information</h4>
            <form id="patientForm">
                <label for="patientId">Patient ID:</label>
                <input type="text" id="patientId">

                <label for="accessionNo">Accession No:</label>
                <input type="text" id="accessionNo">

                <label for="patientName">Patient Name:</label>
                <input type="text" id="patientName">

                <label for="patientDOB">Patient DOB:</label>
                <input type="text" id="patientDOB">

                <label for="patientSex">Patient Sex:</label>
                <select id="patientSex">
                    <option value="">Select</option>
                    <option value="M">Male</option>
                    <option value="F">Female</option>
                    <option value="O">Other</option>
                </select>

                <label for="studyType">Study Type:</label>
                <select id="studyType">
                    <option value="CR">X-Ray (CR)</option>
                    <option value="CT">CT</option>
                    <option value="MR">MRI</option>
                </select>

                <div class="flex">
                    <button type="button" id="fillDummyBtn">Fill Dummy Info</button>
                    <button type="button" id="uploadDicomBtn">Upload to PACS</button>
                    <button type="button" id="downloadDicomBtn">Download DICOM</button>
                    <button type="button" id="clearFieldsBtn">Clear</button>
                </div>
            </form>
        </div>

    </div>

    <script src="portal.js"></script>
</body>
</html>
